version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-pmd3_server_1
      APP_PORT: 80
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/pmd3.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x /appdata; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/pmd3/. /appdata/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: python:3.12-slim
    restart: on-failure
    command: ["sleep","infinity"]
    volumes:
      - ${APP_DATA_DIR}/data/home:/root
      - ${APP_DATA_DIR}/data/lockdown:/var/lib/lockdown
