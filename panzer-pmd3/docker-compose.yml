version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-pmd3_server_1
      APP_PORT: 80
  server:
    image: python:3.12-slim
    restart: on-failure
    command: ["sleep","infinity"]
    volumes:
      - ${APP_DATA_DIR}/data/home:/root
      - ${APP_DATA_DIR}/data/lockdown:/var/lib/lockdown
