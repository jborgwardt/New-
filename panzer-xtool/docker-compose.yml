version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-xtool_server_1
      APP_PORT: 8099
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/xtool.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/xtool/. /appdata/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: xtool-local:1.21.0
    pull_policy: never
    restart: on-failure
    command: ["bash","-c","usbmuxd -U root -z 2>/dev/null; exec sleep infinity"]
    volumes:
      - ${APP_DATA_DIR}/data/downloads:/downloads
      - ${APP_DATA_DIR}/data/home:/root
      - ${APP_DATA_DIR}/data/work:/work
