version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-bubbalostreamer_server_1
      APP_PORT: 7000
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/bubbalostreamer.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/bubbalostreamer/. /appdata/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: bubbalostreamer:1.8.2-altmount.1
    pull_policy: never
    restart: on-failure
    command: ["npm","start"]
    environment:
      TZ: America/New_York
      CONFIG_DIR: /config/config
      ADDON_SHARED_SECRET: d4193a68b36ce7a3cf52da3b485cc00a040198947658c0e77c9e6ba14f490385
    volumes:
      - ${APP_DATA_DIR}/data:/config
