version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-mosquitto_server_1
      APP_PORT: 9001
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/mosquitto.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x /appdata; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/mosquitto/. /appdata/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: eclipse-mosquitto:2
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/mosquitto/config
      - ${APP_DATA_DIR}/data/data:/mosquitto/data
      - ${APP_DATA_DIR}/data/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
