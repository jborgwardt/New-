version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-mosquitto_server_1
      APP_PORT: 9001
  server:
    image: eclipse-mosquitto:2
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/mosquitto/config
      - ${APP_DATA_DIR}/data/data:/mosquitto/data
      - ${APP_DATA_DIR}/data/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
