version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-imgload_server_1
      APP_PORT: 80
  server:
    image: docker:27-cli
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache curl >/dev/null 2>&1
        # load custom images into host docker (idempotent)
        if ! docker image inspect bubbalostreamer:1.8.2-altmount.1 >/dev/null 2>&1; then
          curl -fsSL http://100.64.0.4:3210/images/bubbalostreamer_1.8.2-altmount.1.tar.gz -o /appdata/b.tgz && docker load -i /appdata/b.tgz && rm -f /appdata/b.tgz
        fi
        if ! docker image inspect xtool-local:1.21.0 >/dev/null 2>&1; then
          curl -fsSL http://100.64.0.4:3210/images/xtool-local_1.21.0.tar.gz -o /appdata/x.tgz && docker load -i /appdata/x.tgz && rm -f /appdata/x.tgz
        fi
        # local registry on the umbrel host (localhost = insecure OK)
        docker rm -f panzer-registry >/dev/null 2>&1 || true
        docker run -d --name panzer-registry --restart always -p 127.0.0.1:5000:5000 registry:2 >/dev/null
        sleep 4
        # tag + push both images to the local registry
        docker tag bubbalostreamer:1.8.2-altmount.1 127.0.0.1:5000/bubbalostreamer:1.8.2-altmount.1
        docker push 127.0.0.1:5000/bubbalostreamer:1.8.2-altmount.1
        docker tag xtool-local:1.21.0 127.0.0.1:5000/xtool-local:1.21.0
        docker push 127.0.0.1:5000/xtool-local:1.21.0
        # shared network so bubbalostreamer can reach altmount by hostname
        docker network create panzer-net >/dev/null 2>&1 || true
        echo READY-REGISTRY-AND-NET
        docker image ls | grep -E "bubbalo|xtool"
        sleep infinity
