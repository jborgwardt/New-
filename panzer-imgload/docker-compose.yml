version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-imgload_server_1
      APP_PORT: 80
  server:
    image: docker:27-cli
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'apk add --no-cache curl >/dev/null 2>&1; if ! docker image inspect bubbalostreamer:1.8.2-altmount.1 >/dev/null 2>&1; then curl -fsSL http://100.64.0.4:3210/images/bubbalostreamer_1.8.2-altmount.1.tar.gz -o /appdata/b.tgz && docker load -i /appdata/b.tgz && rm -f /appdata/b.tgz; fi; if ! docker image inspect xtool-local:1.21.0 >/dev/null 2>&1; then curl -fsSL http://100.64.0.4:3210/images/xtool-local_1.21.0.tar.gz -o /appdata/x.tgz && docker load -i /appdata/x.tgz && rm -f /appdata/x.tgz; fi; echo READY; docker image ls | grep -E "bubbalo|xtool"; sleep infinity'
