version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-nzbdav_server_1
      APP_PORT: 3000
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/NzbDAV.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x /appdata/config; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/NzbDAV/. /appdata/config/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: nzbdav/nzbdav:alpha
    restart: on-failure
    environment:
      TZ: America/New_York
      PUID: "99"
      PGID: "100"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
