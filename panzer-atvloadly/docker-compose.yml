version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-atvloadly_server_1
      APP_PORT: 80
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/atvloadly.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/atvloadly/. /appdata/ 2>/dev/null || true; touch /appdata/.restored; fi'
  server:
    image: bitxeno/atvloadly:latest
    restart: on-failure
    depends_on:
      restore:
        condition: service_completed_successfully
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/avahi-daemon:/var/run/avahi-daemon
      - /var/run/dbus:/var/run/dbus
