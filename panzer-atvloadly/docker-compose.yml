version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-atvloadly_server_1
      APP_PORT: 80
  server:
    image: bitxeno/atvloadly:latest
    restart: on-failure
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/avahi-daemon:/var/run/avahi-daemon
      - /var/run/dbus:/var/run/dbus
