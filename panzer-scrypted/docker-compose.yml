version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-scrypted_server_1
      APP_PORT: 10443
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/scrypted.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x /appdata/volume; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/scrypted/. /appdata/volume/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: ghcr.io/koush/scrypted
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/volume:/server/volume
