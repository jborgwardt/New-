version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-signtools_server_1
      APP_PORT: 8080
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/signtools.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x /appdata; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/signtools/. /appdata/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: signtools/signtools:3.0.12
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/signer-cfg.yml:/signer-cfg.yml
