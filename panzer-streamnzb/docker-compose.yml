version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-streamnzb_server_1
      APP_PORT: 7000
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/streamnzb.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x /appdata; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/streamnzb/. /appdata/; touch /appdata/.restored; fi'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: ghcr.io/gaisberg/streamnzb:latest
    restart: on-failure
    command: ["./streamnzb"]
    environment:
      TZ: America/New_York
    ports:
      - "7000:7000"
      - "119:119"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
