version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-altmount_server_1
      APP_PORT: 8080
  restore:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
    command:
      - /bin/sh
      - -c
      - 'set -e; if [ ! -e /appdata/.restored ]; then apk add --no-cache curl zstd tar >/dev/null; curl -fsSL http://100.64.0.4:3210/appdata/altmount.tar.zst -o /tmp/a.zst; mkdir -p /tmp/x; zstd -dc /tmp/a.zst | tar -xf - -C /tmp/x; cp -a /tmp/x/altmount/. /appdata/; touch /appdata/.restored; fi; mkdir -p /appdata/media/symlinks /appdata/remotes'
  server:
    depends_on:
      restore:
        condition: service_completed_successfully
    image: ghcr.io/javi11/altmount:latest
    restart: on-failure
    environment:
      PUID: "99"
      PGID: "100"
      PORT: "8080"
      TZ: America/New_York
      JWT_SECRET: fed75fc0a0f6a1d2b1d898914aa94e450311c7b973f4e9bdcab499670eeeac12
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    group_add:
      - "281"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "8585:8080"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/metadata:/metadata
      - ${APP_DATA_DIR}/data/media:/mnt/cache/media
      - ${APP_DATA_DIR}/data/remotes:/mnt/remotes
