version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: panzer-altmount_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/javi11/altmount:latest
    restart: on-failure
    environment:
      PUID: "99"
      PGID: "100"
      PORT: "8080"
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/metadata:/metadata
